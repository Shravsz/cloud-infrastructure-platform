apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: "cloud-platform-app"
        metrics_path: /metrics
        static_configs:
          - targets:
              - cloud-platform.default.svc.cluster.local:5000

